<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Exaustão - Rack de Servidores</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#d9dcdf;--pn:#eceef0;--tx:#1b1f23;--mut:#555d66;--ln:#8a9199;--hd:#2b3138;--hdt:#e8eaec;--lo:#7d848b;--ok:#2e9e4f;--al:#d8321f;--hl:#fff3b0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--pn:#22272c;--tx:#e4e7ea;--mut:#9aa2aa;--ln:#4a525a;--hd:#0d0f11;--lo:#555c63;--ok:#38c25f;--al:#ff4a36;--hl:#4a4520}}
:root[data-theme="dark"]{--bg:#15181b;--pn:#22272c;--tx:#e4e7ea;--mut:#9aa2aa;--ln:#4a525a;--hd:#0d0f11;--lo:#555c63;--ok:#38c25f;--al:#ff4a36;--hl:#4a4520}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:14px}
header{background:var(--hd);color:var(--hdt);padding:10px 16px;font-family:"Courier New",monospace;letter-spacing:.5px}
header small{display:block;color:#9aa2aa;font-size:11px}
main{max-width:920px;margin:0 auto;padding:12px;display:grid;gap:12px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
section{background:var(--pn);border:1px solid var(--ln)}
h2{margin:0;padding:5px 10px;font-size:12px;font-weight:700;letter-spacing:1px;border-bottom:1px solid var(--ln);background:color-mix(in srgb,var(--ln) 25%,transparent)}
.in{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--ln)}
.in:last-child{border:0}
.lamp{width:16px;height:16px;border-radius:50%;border:2px solid var(--ln);background:var(--lo)}
.lamp.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.in b{display:block;font-size:13px}.in span{font-size:12px;color:var(--mut);font-family:"Courier New",monospace}
.sl{width:54px;height:26px;border:2px solid var(--tx);background:var(--lo);position:relative;cursor:pointer;padding:0}
.sl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:18px;background:var(--pn);border:2px solid var(--tx)}
.sl.on{background:var(--ok)}.sl.on::after{left:26px}
.out{padding:12px;text-align:center}
#st{font-family:"Courier New",monospace;font-weight:700;font-size:15px;padding:8px;border:2px solid var(--ln);background:var(--lo);color:#fff}
#st.on{background:var(--al);border-color:var(--al);animation:pl 1.2s steps(2) infinite}
@keyframes pl{50%{opacity:.55}}
#fan{width:84px;height:84px;margin:10px auto 4px;display:block;color:var(--lo)}
#fan.on{color:var(--tx);animation:sp .5s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#why{margin:0;font-size:12px;color:var(--mut);min-height:30px}
.sc{overflow-x:auto;padding:8px}
.expr{padding:8px 10px;font-family:"Courier New",monospace;border-bottom:1px solid var(--ln);font-size:13px}
table{border-collapse:collapse;width:100%;font-family:"Courier New",monospace;font-size:13px}
th,td{border:1px solid var(--ln);padding:4px 8px;text-align:center}
td:last-child{text-align:left;font-family:Arial,sans-serif;font-size:12px}
th{background:color-mix(in srgb,var(--ln) 25%,transparent)}
tr.cur td{background:var(--hl);font-weight:700}
svg text{fill:var(--tx);font-family:Arial,sans-serif;font-size:12px}
.w{stroke:var(--lo);stroke-width:2.5;fill:none}.w.on{stroke:var(--ok)}
.g{fill:var(--pn);stroke:var(--tx);stroke-width:2}
</style>
</head>
<body>
<header>CONTROLE DE EXAUSTÃO DE EMERGÊNCIA<small>Rack de servidores crítico | S = A + B·C'</small></header>
<main>
<div class="row2">
<section>
<h2>ENTRADAS</h2>
<div class="in"><i class="lamp" id="lA"></i><div><b>A - Sensor de fumaça</b><span id="tA"></span></div><button class="sl" id="bA" aria-label="Alternar A"></button></div>
<div class="in"><i class="lamp" id="lB"></i><div><b>B - Sensor de temperatura</b><span id="tB"></span></div><button class="sl" id="bB" aria-label="Alternar B"></button></div>
<div class="in"><i class="lamp" id="lC"></i><div><b>C - Chave de manutenção</b><span id="tC"></span></div><button class="sl" id="bC" aria-label="Alternar C"></button></div>
</section>
<section>
<h2>SAÍDA S</h2>
<div class="out">
<div id="st"></div>
<svg id="fan" viewBox="0 0 100 100" fill="currentColor"><g id="bl"><ellipse cx="50" cy="26" rx="10" ry="22"/><ellipse cx="74" cy="50" rx="22" ry="10"/><ellipse cx="50" cy="74" rx="10" ry="22"/><ellipse cx="26" cy="50" rx="22" ry="10"/></g><circle cx="50" cy="50" r="8" stroke="var(--pn)" stroke-width="3"/></svg>
<p id="why"></p>
</div>
</section>
</div>

<section>
<h2>DIAGRAMA LÓGICO</h2>
<div class="sc"><svg viewBox="0 0 560 190" width="100%" style="min-width:480px">
<text x="8" y="45">A</text><text x="8" y="105">B</text><text x="8" y="165">C</text>
<path id="wA" class="w" d="M24 41H430V70H478"/>
<path id="wC" class="w" d="M24 161H70"/>
<path id="wN" class="w" d="M121 161H200V125H230"/>
<path id="wB" class="w" d="M24 101H200V95H230"/>
<path id="wX" class="w" d="M310 110H350V90H478"/>
<path id="wS" class="w" d="M520 80H540"/>
<polygon class="g" points="70,143 70,179 110,161"/><circle class="g" cx="115" cy="161" r="5"/>
<path class="g" d="M230 80H268Q310 80 310 110Q310 140 268 140H230Z"/><text x="248" y="114">AND</text>
<path class="g" d="M472 62Q500 62 520 80Q500 98 472 98Q486 80 472 62Z"/><text x="487" y="84" style="font-size:10px">OR</text>
<circle id="led" cx="552" cy="80" r="10" class="g"/><text x="546" y="112">S</text>
</svg></div>
</section>

<section>
<h2>TABELA VERDADE</h2>
<div class="expr">S = A + B·C'</div>
<div class="sc"><table><thead><tr><th>A</th><th>B</th><th>C</th><th>S</th><th>Situação</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>
</main>
<script>
var s={A:0,B:0,C:0},rows=[];
function f(a,b,c){return a|(b&(c?0:1));}
function why(a,b,c){
 if(a)return "Fumaça detectada: acionamento imediato, prioridade absoluta.";
 if(b&&!c)return "Superaquecimento em modo automático: exaustão acionada.";
 if(b&&c)return "Superaquecimento inibido: manutenção em andamento.";
 return "Condições normais.";
}
var tb=document.getElementById("tb");
for(var i=0;i<8;i++){
 var a=i>>2&1,b=i>>1&1,c=i&1,tr=document.createElement("tr");
 tr.innerHTML="<td>"+a+"</td><td>"+b+"</td><td>"+c+"</td><td>"+f(a,b,c)+"</td><td>"+why(a,b,c)+"</td>";
 tb.appendChild(tr);rows.push(tr);
}
function $(id){return document.getElementById(id);}
function wire(id,v){$(id).setAttribute("class","w"+(v?" on":""));}
function draw(){
 var a=s.A,b=s.B,c=s.C,n=c?0:1,x=b&n,o=a|x;
 var T={A:["Ambiente normal","Fumaça detectada"],B:["Temperatura normal","Acima do limite"],C:["Modo automático","Modo manual"]};
 ["A","B","C"].forEach(function(k){
  $("b"+k).className="sl"+(s[k]?" on":"");
  $("l"+k).className="lamp"+(s[k]?" on":"");
  $("t"+k).textContent=k+" = "+s[k]+"  "+T[k][s[k]];
 });
 wire("wA",a);wire("wB",b);wire("wC",c);wire("wN",n);wire("wX",x);wire("wS",o);
 $("led").style.fill=o?"var(--al)":"var(--lo)";
 $("st").className=o?"on":"";
 $("st").textContent=o?"EXAUSTÃO ACIONADA  S = 1":"EXAUSTÃO DESLIGADA  S = 0";
 $("fan").setAttribute("class",o?"on":"");
 $("why").textContent=why(a,b,c);
 rows.forEach(function(r,i){r.className=(i===(a<<2|b<<1|c))?"cur":"";});
}
["A","B","C"].forEach(function(k){$("b"+k).onclick=function(){s[k]^=1;draw();};});
draw();
</script>
</body>
</html>
